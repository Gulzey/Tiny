name: Release Tiny for Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release source and version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          if ($version -ne $tauriVersion -or $version -ne $cargoVersion) { throw 'Release versions do not match.' }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'The tag must match package.json.' }

      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e

      - name: Build signed Windows updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TINY_RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          npm run build:desktop
          npm run build:server
          npm run package:release

      - uses: actions/upload-artifact@v4
        with:
          name: tiny-windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/Tiny-Setup.exe
            release/Tiny-Setup.exe.sig
            release/latest.json

      - name: Publish stable updater release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --title 'Tiny ${{ github.ref_name }}' --notes "Signed stable Windows release from ${{ github.repository }}@${{ github.sha }}" release/Tiny-Setup.exe release/Tiny-Setup.exe.sig release/latest.json
